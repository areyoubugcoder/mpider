name: CI

# PR 只读 Rust 缓存；main 推送负责写入，供后续 PR 和发行复用。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      native: ${{ steps.filter.outputs.native }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: 核验路径过滤规则
        run: python3 -B -m unittest discover -s tools -p 'test_ci*.py'
      - name: 选择相关检查
        id: filter
        run: python3 tools/ci-changes.py

  rust:
    name: Rust (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 安装 rust-toolchain.toml 固定的工具链
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: powershell -NoProfile -ExecutionPolicy Bypass -File ${{ github.workspace }}/tools/run-windows-test.ps1
        run: cargo test --locked -p mpider-core -p article-md -p mpider-tauri

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p frontend/tsconfig.json
      - run: pnpm build
      - name: 界面契约与更新发行回归
        run: pnpm test:frontend

  native:
    name: Native (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: 安装原生测试依赖
        run: python -m pip install -r native/requirements.txt
      - name: 原生桥协议离线测试
        run: python -B -m unittest discover -s native -p 'test_*.py'
      - name: 原生观察与列表过滤回归
        run: pnpm test:native

  ci:
    name: CI configuration
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 路径判断与汇总检查回归
        run: python3 -B -m unittest discover -s tools -p 'test_ci*.py'
      - name: 核验 workflow 语法与任务依赖
        uses: docker://rhysd/actionlint:1.7.12

  result:
    name: CI
    if: always()
    needs: [changes, frontend, rust, native, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 确认所需检查均已通过
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B tools/check-ci-results.py
