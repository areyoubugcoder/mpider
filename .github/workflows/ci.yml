name: CI

on:
  push:
    branches: [main]
    # 在触发前过滤公开资料；编入界面的文档仍需检查。
    paths:
      - '**'
      - '!*.md'
      - '!LICENSE'
      - '!docs/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/release-notes.md'
      - '!.github/pull_request_template.md'
      - 'docs/faq.md'
      - 'docs/laboratory.md'
      - 'docs/request-policy.md'
  pull_request:
    branches: [main]
    # 保留必需检查结果，避免纯文档 PR 因缺少状态而无法合并。

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: 核验路径过滤规则
        run: python3 -m unittest discover -s tools -p 'test_ci_changes.py'
      - name: 判断是否需要构建
        id: filter
        run: python3 tools/ci-changes.py

  rust:
    name: Rust (windows-latest)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: powershell -NoProfile -ExecutionPolicy Bypass -File ${{ github.workspace }}/tools/run-windows-test.ps1
        run: cargo test --locked -p mpider-core -p article-md -p mpider-tauri
      - uses: actions/setup-python@v7.1.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Windows 原生协议离线测试
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r native/requirements.txt
          python -B -m unittest discover -s native -p 'test_*.py'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p frontend/tsconfig.json
      - run: pnpm build
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: 原生桥协议离线测试
        run: |
          python -m pip install -r native/requirements.txt
          python -m unittest discover -s native -p 'test_*.py'
      - name: 界面契约与原生桥回归
        run: pnpm test
