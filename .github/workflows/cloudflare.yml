name: Cloudflare

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/cloudflare.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Cloudflare website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: 安装网站依赖
        run: pnpm install --frozen-lockfile
      - name: 检查、构建并验证 Workers 发布配置
        run: pnpm deploy:cloudflare --dry-run

  deploy:
    name: Deploy Cloudflare website
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-production
      url: https://mpider.followto.us/
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: website
    steps:
      - name: 确认部署凭证已配置
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::请配置 CLOUDFLARE_API_TOKEN secret 和 CLOUDFLARE_ACCOUNT_ID variable。'
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: 安装网站依赖
        run: pnpm install --frozen-lockfile
      - name: 构建并发布到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:cloudflare
      - name: 检查线上 HTTPS
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null https://mpider.followto.us/
