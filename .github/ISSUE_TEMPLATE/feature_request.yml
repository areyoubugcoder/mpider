name: 功能建议
description: 描述希望解决的使用问题
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景和当前障碍，避免提交真实账号或敏感数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望的行为
      description: 给出一个具体操作和结果，说明涉及的平台。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式（可选）
